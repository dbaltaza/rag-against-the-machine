[project]
name = "rag-against-the-machine"
version = "1.0.0"
description = "Retrieval-Augmented Generation over the vLLM codebase (42 project)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fire>=0.7.0",
    "tqdm>=4.66",
    "pydantic>=2.7",
    "numpy>=1.26",
    "scipy>=1.12",
    "torch>=2.3",
    "transformers>=4.51",
    "accelerate>=0.30",
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=3.0"]

[dependency-groups]
dev = [
    "flake8>=7.0",
    "mypy>=1.10",
    "pytest>=8.0",
    "types-tqdm",
    "httpx>=0.27",
]

[tool.uv]
default-groups = ["dev"]

[tool.mypy]
python_version = "3.10"
exclude = ["^data/", "^moulinette/", "^\\.venv/"]

[[tool.mypy.overrides]]
module = ["fire", "fire.*", "scipy", "scipy.*", "transformers", "transformers.*", "sentence_transformers", "sentence_transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
